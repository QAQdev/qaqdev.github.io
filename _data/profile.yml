intro_body_html: >-
  I am a third-year Ph.D. student at
  <img class="inline-logo" src="/images/thumbs/lab-logo.webp" alt="LINs Lab">
  <a href="https://lins-lab.github.io" target="_blank" rel="noopener noreferrer">LINs Lab, Westlake University</a>
  (joint program with Zhejiang University), advised by
  <a href="https://tlin-taolin.github.io/" target="_blank" rel="noopener noreferrer">Prof. Tao Lin</a>.
  Previously, I received my B.E. in Software Engineering from Zhejiang University (ZJU).
  My long-term research goal is to build efficient multimodal agents that can
  <strong>understand</strong> the physical world, <strong>reason</strong> on real-world problems,
  and <strong>generate</strong> novel ideas—continually learning from experience in an evolving environment.

research_focus:
  - index: "01 / FOCUS"
    title: "Interactive Video & World Models"
    description: "Making video diffusion models strong, responsive, and real-time interactive entrypoints for real-world users."
  - index: "02 / FOCUS"
    title: "Few-Step Generation"
    description: "Training and distilling large continuous diffusion generators into high-fidelity 1-step or few-step models."

