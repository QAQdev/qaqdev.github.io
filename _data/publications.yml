    A <strong>6B unified diffusion model family</strong> for high-quality image generation and editing—supporting
    text-to-image, VQ-conditioned generation, instruction-guided editing, and Chinese–English text rendering;
    its Turbo variant enables fast generation and editing in only <strong>2–4 sampling steps</strong>.
