- id: "twinflow"
  venue: "ICLR 2026"
  venue_style: "conference"
  title: "TwinFlow: Realizing One-step Generation on Large Models with Self-adversarial Flows"
  url: "https://www.arxiv.org/abs/2512.05150"
  orientation: "landscape"
  slides:
    - src: "/images/twinflow.png"
      alt: "TwinFlow self-adversarial flow framework diagram"
      caption: "TwinFlow — Self-adversarial flow framework diagram"
      diagram: true
    - src: "/images/twinflow_qwen-web.jpg"
      alt: "TwinFlow few-step generation showcase on Qwen-Image-20B"
      caption: "TwinFlow — Few-step generation results on Qwen-Image-20B"
      diagram: false
  authors:
    - name: "Zhenglin Cheng"
      me: true
      equal: true
    - name: "Peng Sun"
      equal: true
    - name: "Jianguo Li"
    - name: "Tao Lin"
  summary: >-
    Tames <strong>large-scale few-step training</strong> through self-adversarial flows,
    <strong>eliminating auxiliary networks (discriminators, teachers, fake scores)</strong> via a clean
    one-model design—transforming <strong>Qwen-Image-20B</strong> into a high-quality few-step generator.
  links:
    - type: "paper"
      label: "Paper"
      url: "https://www.arxiv.org/abs/2512.05150"
    - type: "project"
      label: "Project"
      url: "https://zhenglin-cheng.com/twinflow"
    - type: "github"
      label: "Code"
      url: "https://github.com/inclusionAI/TwinFlow"
      repo: "inclusionAI/TwinFlow"
    - type: "huggingface"
      label: "Checkpoints"
      url: "https://huggingface.co/inclusionAI/TwinFlow"

- id: "dynmoe"
  venue: "ICLR 2025"
  venue_style: "conference"
  title: "Dynamic Mixture of Experts: An Auto-Tuning Approach for Efficient Transformer Models"
  url: "https://openreview.net/forum?id=T26f9z2rEe"
  orientation: "landscape"
  slides:
    - src: "/images/adaptive.jpg"
      alt: "DynMoE dynamic expert activation and auto-tuning architecture"
      caption: "DynMoE — Dynamic expert activation and auto-tuning architecture"
      diagram: true
  authors:
    - name: "Yongxin Guo"
      equal: true
    - name: "Zhenglin Cheng"
      me: true
      equal: true
    - name: "Xiaoying Tang"
    - name: "Zhaopeng Tu"
    - name: "Tao Lin"
  summary: >-
    Frees the burden of pivotal hyper-parameter selection for MoE training by enabling each token to
    activate a variable number of experts and adjusting the number of experts automatically—achieving
    stronger sparsity while maintaining performance.
