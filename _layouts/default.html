<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body
    data-oneko-target="{{ site.data.profile.latest_paper_id | default: 'llada-image' }}"
    data-oneko-sprite="{{ '/images/oneko.gif' | relative_url }}">

    {% include components/masthead.html %}

    <div class="layout">
      {% if page.author_profile != false %}
        {% include components/sidebar.html %}
      {% endif %}

      <main class="content" role="main">
        {{ content }}
      </main>
    </div>

    {% include components/lightbox.html %}
    {% include scripts.html %}
  </body>
</html>
